name: olfa
description: "OLFA | أُلْفَة — Serious Dating & Marriage Platform"
publish_to: "none"
version: 0.1.0+1

# Pinned at project creation (2026-11). Verify with `flutter pub outdated`
# against the current Flutter stable before Phase 2 and record the result in
# docs/adr/0002-mobile-dependencies.md.
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  web_socket_channel: ^3.0.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2
  socket_io_client: ^3.0.2
  flutter_timezone: ^3.0.1
  geolocator: ^13.0.2 # approximate location for "nearest first" (rounded to ~1 km)
  geocoding: ^3.0.0 # device-side country/city lookup
  flutter_stripe: ^11.4.0 # consultation payments (person-to-person service, web payment)
  flutter_image_compress: ^2.3.0 # chat photos: ≤2048 px, q86, EXIF removed on device
  record: ^5.2.0 # voice notes: AAC-LC 48 kHz mono, ≤60 s
  just_audio: ^0.9.42 # voice-note playback + notification/message sounds
  path_provider: ^2.1.4
  in_app_purchase: ^3.2.0 # App Store (StoreKit 2) / Google Play Billing; receipts are verified by the server
  in_app_purchase_android: ^0.4.0
  in_app_purchase_storekit: ^0.3.20
  screen_protector: ^1.4.2 # members' photos: no screenshots / recordings (Android FLAG_SECURE, iOS secure layer + capture cover)
  google_mlkit_face_detection: ^0.14.0 # selfie verification: on-device face checks (nothing is sent to Google)
  file_picker: ^8.1.7 # support attachments: PDF files
  url_launcher: ^6.3.1 # payment history: manage subscription in App Store / Google Play
  # Phase 3 (needs Firebase project config files first):
  # firebase_core, firebase_messaging

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/sounds/
  # Font files are fetched by scripts/fetch_fonts.sh (SIL OFL, from google/fonts).
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
