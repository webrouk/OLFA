<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLFA — Live Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#8B0D2B;--k:#1A1A1A;--g:#E9E9E9;--w:#FFFFFF;
--p8:rgba(139,13,43,.08);--p16:rgba(139,13,43,.16);--k60:rgba(26,26,26,.62);--k40:rgba(26,26,26,.4);--k08:rgba(26,26,26,.06);--w60:rgba(255,255,255,.6)}
html[lang=ar]{--f:'Tajawal',system-ui,sans-serif}
html[lang=en],html[lang=fr]{--f:'Montserrat',system-ui,sans-serif}
html,body{height:100%}
body{font-family:var(--f);color:var(--k);background:var(--g);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
.ltr{direction:ltr;unicode-bidi:isolate}
[dir=rtl] .flip{transform:scaleX(-1)}

/* ── preview chrome ── */
.tool{position:fixed;top:0;left:0;right:0;height:60px;background:var(--w);border-bottom:1px solid var(--g);display:flex;align-items:center;gap:10px;padding:0 16px;z-index:20}
.tool .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-inline-end:auto;white-space:nowrap}
.tool .brand small{font-weight:500;color:var(--k60);font-size:12px}
.seg{display:inline-flex;background:var(--g);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:32px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--k60);white-space:nowrap}
.seg button.on{background:var(--w);color:var(--k);font-weight:600;box-shadow:0 1px 2px var(--k08)}
.tsel{height:38px;border-radius:10px;border:1px solid var(--g);background:var(--w);padding:0 10px;font-size:13px;max-width:190px}
.side{position:fixed;top:60px;bottom:0;inset-inline-start:0;width:250px;background:var(--w);border-inline-end:1px solid var(--g);overflow:auto;padding:12px 10px 40px;z-index:10}
.side h4{font-size:11px;font-weight:600;color:var(--k40);margin:16px 10px 6px;letter-spacing:.02em}
.side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:start;padding:8px 10px;border-radius:10px;font-size:13.5px;color:var(--k)}
.side button span.n{width:22px;height:22px;border-radius:7px;background:var(--g);font-size:11px;display:grid;place-items:center;font-weight:600;flex:none}
.side button.on{background:var(--p8);color:var(--p);font-weight:600}
.side button.on span.n{background:var(--p);color:var(--w)}
.stage{position:fixed;top:60px;bottom:0;inset-inline-start:250px;inset-inline-end:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:28px}
.stage.grid{display:block}
.gridwrap{display:flex;flex-wrap:wrap;gap:28px 22px;justify-content:center;padding-bottom:40px}
.gcell{display:flex;flex-direction:column;align-items:center;gap:10px}
.gcell .cap2{font-size:12px;font-weight:600;color:var(--k60)}
.gcell .scaler{cursor:pointer}
.gtitle{width:100%;font-size:14px;font-weight:700;margin:18px 0 4px;text-align:center}
.scaler{position:relative;flex:none}
.scaler>.device,.scaler>.adm{position:absolute;top:0;left:0;transform-origin:0 0}
.demo{font-size:11px;color:var(--k60);background:var(--g);border-radius:8px;padding:4px 8px;white-space:nowrap}
.adm-mode .side{display:none}.adm-mode .stage{inset-inline-start:0}
@media(max-width:900px){.side{display:none}.stage{inset-inline-start:0}.tool .brand small,.demo{display:none}}
@media(max-width:620px){.tool{gap:6px;padding:0 8px;height:auto;min-height:60px;flex-wrap:wrap;padding-block:8px}.stage{top:104px}.tool .brand{flex-basis:100%}}

/* ── device ── */
.device{width:var(--W);height:var(--H);background:var(--w);border-radius:var(--rad);position:relative;overflow:hidden;box-shadow:0 0 0 9px var(--k),0 0 0 10px #000,0 24px 60px rgba(26,26,26,.22)}
.sbar{position:absolute;top:0;left:0;right:0;height:var(--sat);display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 8px;font-size:14px;font-weight:600;z-index:30;pointer-events:none;font-family:'Montserrat',system-ui,sans-serif;direction:ltr}
.sbar.light{color:var(--w)}
.sbar.sm{padding-bottom:4px;font-size:12px;padding-inline:16px}
.island{position:absolute;top:11px;left:50%;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000;z-index:31}
.punch{position:absolute;top:12px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#000;z-index:31}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--k);z-index:31;pointer-events:none}
.homebar.and{width:108px;height:4px;margin-left:-54px;opacity:.6}
.homebar.light{background:var(--w)}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:var(--w)}
.scr::-webkit-scrollbar{display:none}
.scr.navd{padding-bottom:calc(var(--sab) + 100px)}
.full{min-height:100%;display:flex;flex-direction:column}
.safe-top{height:var(--sat);flex:none}
.pad{padding-inline:20px}
.grow{flex:1}
.foot{padding:16px 20px calc(var(--sab) + 16px);display:flex;flex-direction:column;gap:10px}
.sticky-foot{position:sticky;bottom:0;background:var(--w);border-top:1px solid var(--g);z-index:3}

/* ── typography ── */
.display{font-size:34px;font-weight:700;line-height:1.2}
.h1{font-size:28px;font-weight:700;line-height:1.25}
.h2{font-size:22px;font-weight:700;line-height:1.3}
.h3{font-size:17px;font-weight:600;line-height:1.35}
.bl{font-size:16px;line-height:1.6}
.bm{font-size:15px;line-height:1.6}
.bs{font-size:13px;line-height:1.55}
.cap{font-size:12.5px;line-height:1.5;color:var(--k60)}
.mut{color:var(--k60)}
html[lang=en] .h1,html[lang=fr] .h1,html[lang=en] .display,html[lang=fr] .display{letter-spacing:-.02em}
html[lang=en] .h1,html[lang=fr] .h1{font-size:26px}html[lang=en] .display,html[lang=fr] .display{font-size:31px}

/* ── components ── */
.btn{height:52px;border-radius:14px;border:0;background:var(--p);color:var(--w);font-weight:600;font-size:16px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn.out{background:var(--w);color:var(--k);box-shadow:inset 0 0 0 1.5px var(--g)}
.btn.ghost{background:none;color:var(--k60);height:44px}
.btn.dark{background:var(--k)}
.btn.wh{background:var(--w);color:var(--p)}
.btn.sm{height:38px;font-size:13.5px;width:auto;padding:0 14px;border-radius:11px}
.link{color:var(--p);font-weight:600;background:none;border:0;padding:0}
.bar{position:sticky;top:0;z-index:5;background:var(--w);padding-top:var(--sat)}
.bar .in{height:56px;display:flex;align-items:center;gap:6px;padding:0 10px}
.bar h1{flex:1;font-size:17px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{width:44px;flex:none}
.bar.line{border-bottom:1px solid var(--g)}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:none;display:grid;place-items:center;flex:none;color:var(--k)}
.ib.soft{background:var(--g)}
.ib.wh{background:var(--w);box-shadow:0 2px 10px rgba(26,26,26,.12)}
.lbl{font-size:13px;font-weight:500;margin-bottom:8px;display:block}
.inp{width:100%;height:52px;border-radius:14px;border:1.5px solid transparent;background:var(--g);padding:0 16px;font-size:16px;outline:none;transition:.15s}
.inp:focus{border-color:var(--p);background:var(--w)}
.inp.err{border-color:var(--p);background:var(--p8)}
select.inp{appearance:none;-webkit-appearance:none}
textarea.inp{height:104px;padding:14px 16px;resize:none;line-height:1.6}
.fld{margin-bottom:18px}
.errtx{font-size:12.5px;color:var(--p);margin-top:6px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--g);background:var(--w);font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{border-color:var(--p);background:var(--p8);color:var(--p);font-weight:600}
.chip.sm{height:30px;font-size:12.5px;padding:0 10px;border-radius:15px}
.chip.lock{opacity:.5}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;font-weight:600;background:var(--g);color:var(--k);white-space:nowrap}
.tag.p{background:var(--p8);color:var(--p)}
.tag.k{background:var(--k);color:var(--w)}
.tag.pf{background:var(--p);color:var(--w)}
.list{background:var(--w);border-radius:18px;box-shadow:0 0 0 1px var(--g);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:58px;border:0;border-bottom:1px solid var(--g);width:100%;background:none;text-align:start}
.row:last-child{border-bottom:0}
.row .ico{width:38px;height:38px;border-radius:12px;background:var(--g);display:grid;place-items:center;flex:none}
.row .ico.p{background:var(--p8);color:var(--p)}
.row .tx{flex:1;min-width:0}
.row .t1{font-size:15px;font-weight:500}
.row .t2{font-size:12.5px;color:var(--k60);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--k40)}
.row.danger .t1{color:var(--p)}
.sec{font-size:13px;font-weight:600;color:var(--k60);margin:26px 4px 10px}
.tg{width:48px;height:28px;border-radius:14px;background:var(--g);position:relative;flex:none;border:0}
.tg::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--w);box-shadow:0 1px 3px rgba(26,26,26,.2);transition:.2s}
.tg.on{background:var(--p)}
.tg.on::after{inset-inline-start:23px}
.check{display:flex;gap:12px;align-items:flex-start;background:none;border:0;text-align:start;width:100%;padding:6px 0;font-size:14px;line-height:1.55}
.check .bx{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--k40);flex:none;display:grid;place-items:center;margin-top:1px;color:var(--w)}
.check.on .bx{background:var(--p);border-color:var(--p)}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--k40);flex:none;position:relative}
.radio.on{border-color:var(--p)}
.radio.on::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--p)}
.opt{display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;border:1.5px solid var(--g);background:var(--w);width:100%;text-align:start;margin-bottom:12px;transition:.15s}
.opt.on{border-color:var(--p);background:var(--p8)}
.opt .big{font-size:18px;font-weight:700}
.progress{height:4px;border-radius:2px;background:var(--g);overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--p);border-radius:2px;transition:width .3s}
.av{border-radius:50%;background:var(--g);display:grid;place-items:center;overflow:hidden;flex:none;position:relative;color:rgba(26,26,26,.18)}
.av b{position:absolute;font-size:40%;color:var(--k60);font-weight:700}
.ph{background:var(--g);position:relative;overflow:hidden;display:grid;place-items:center;color:rgba(26,26,26,.13)}
.ph .sil{width:62%;height:auto;margin-top:18%}
.vbadge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--p);color:var(--w);flex:none}.vbadge.half{background:#8d8d8d}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 28px;gap:10px}
.empty .eic{width:84px;height:84px;border-radius:28px;background:var(--g);display:grid;place-items:center;color:var(--p);margin-bottom:8px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--g);font-size:13.5px;line-height:1.55}
.banner.p{background:var(--p8);color:var(--k)}
.banner svg{color:var(--p);margin-top:2px}
.sk{background:var(--g);border-radius:10px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.toast{position:absolute;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%);background:var(--k);color:var(--w);padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:500;z-index:60;white-space:nowrap;animation:fade .25s both;max-width:90%}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(26,26,26,.42);z-index:50;animation:fadeo .2s both}
@keyframes fadeo{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--w);border-radius:26px 26px 0 0;z-index:51;padding:10px 20px calc(var(--sab) + 18px);max-height:86%;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--g);margin:0 auto 14px}

/* nav */
.nav{position:absolute;inset-inline:14px;bottom:calc(var(--sab) + 12px);height:68px;background:var(--w);border-radius:24px;box-shadow:0 0 0 1px var(--g),0 10px 30px rgba(26,26,26,.10);display:flex;align-items:center;padding:0 6px;z-index:20}
.nav button{flex:1;height:54px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--k40);font-size:10.5px;font-weight:500;border-radius:17px;position:relative;margin:0 2px;min-width:0}
.nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button.on{color:var(--p);background:var(--p8);font-weight:700}
.nav .dot{position:absolute;top:8px;left:calc(50% + 6px);width:9px;height:9px;border-radius:50%;background:var(--p);border:2px solid var(--w)}

/* splash/onboarding */
.splash{background:var(--p);color:var(--w);min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative;cursor:pointer}
.splash .wm{text-align:center}
.splash .wm .ar{font-family:'Tajawal',sans-serif;font-weight:800;font-size:46px;line-height:1.1}
.splash .wm .en{font-family:'Montserrat',sans-serif;font-weight:600;font-size:15px;letter-spacing:.42em;margin-top:6px;padding-inline-start:.42em;opacity:.9}
.splash .tl{position:absolute;bottom:calc(var(--sab) + 40px);font-size:13px;opacity:.8;text-align:center;padding:0 30px}
.pulse-in{animation:pin .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pin{from{opacity:0;transform:scale(.85)}}
.illu{aspect-ratio:1/0.9;max-height:44%;margin:12px 24px 0;border-radius:32px;background:var(--g);display:grid;place-items:center;position:relative;overflow:hidden;flex:none}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--g);transition:.25s}
.dots i.on{width:22px;background:var(--p)}

/* otp */
.otp{display:flex;gap:8px;justify-content:center;direction:ltr}
.otp input{width:48px;height:58px;border-radius:14px;border:1.5px solid transparent;background:var(--g);text-align:center;font-size:22px;font-weight:700;outline:none;font-family:'Montserrat',sans-serif}
.otp input:focus{border-color:var(--p);background:var(--w)}
.otp.err input{border-color:var(--p);background:var(--p8)}

/* discover */
.dhead{display:flex;align-items:center;gap:10px;padding:8px 16px 4px}
.deck{position:relative;flex:1;margin:8px 16px 0;min-height:320px}
.card{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:var(--w);box-shadow:0 0 0 1px var(--g),0 8px 28px rgba(26,26,26,.08);display:flex;flex-direction:column;touch-action:pan-y;user-select:none;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.card.back{transform:scale(.95) translateY(12px);pointer-events:none}
.card.drag{transition:none}
.card .ph{flex:1;min-height:0}
.card .bars{position:absolute;top:10px;inset-inline:12px;display:flex;gap:4px;z-index:2}
.card .bars i{flex:1;height:3px;border-radius:2px;background:var(--w60)}
.card .bars i.on{background:var(--w)}
.card .pnum{position:absolute;bottom:12px;inset-inline-end:12px;z-index:2}
.card .info{padding:14px 16px 16px;flex:none}
.card .nm{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700}
.card .nm .age{font-weight:500}
.stamp{position:absolute;top:34px;z-index:3;padding:6px 14px;border-radius:12px;font-size:22px;font-weight:800;border:3px solid;opacity:0;background:var(--w)}
.stamp.like{inset-inline-start:20px;color:var(--p);border-color:var(--p);transform:rotate(-12deg)}
.stamp.pass{inset-inline-end:20px;color:var(--k);border-color:var(--k);transform:rotate(12deg)}
.acts{display:flex;justify-content:center;align-items:center;gap:16px;padding:14px 0 6px;flex:none}
.acts button{border:0;border-radius:50%;display:grid;place-items:center;background:var(--w);box-shadow:0 0 0 1px var(--g),0 4px 14px rgba(26,26,26,.08);transition:transform .15s}
.acts button:active{transform:scale(.92)}
.acts .s{width:48px;height:48px;color:var(--k60)}
.acts .l{width:64px;height:64px}
.acts .lk{background:var(--p);color:var(--w);box-shadow:0 6px 18px rgba(139,13,43,.28)}
.acts button[disabled]{opacity:.35}
.match{position:absolute;inset:0;background:var(--p);color:var(--w);z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px;animation:fadeo .3s both}
.match .avs{display:flex;margin:18px 0}
.match .avs .av{box-shadow:0 0 0 4px var(--p),0 0 0 6px var(--w)}
.match .avs .av+.av{margin-inline-start:-22px}

/* profile details */
.pd-photo{aspect-ratio:4/5;position:relative}
.pd-photo .ph{position:absolute;inset:0}
.pd-top{position:absolute;top:calc(var(--sat) + 6px);inset-inline:12px;display:flex;justify-content:space-between;z-index:3}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--g);border-radius:14px;padding:12px 14px}
.kv small{display:block;font-size:11.5px;color:var(--k60);margin-bottom:2px}
.kv b{font-size:14px;font-weight:600}

/* grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lcard{border-radius:20px;overflow:hidden;position:relative;aspect-ratio:3/4;background:var(--g)}
.lcard .ph{position:absolute;inset:0}
.lcard .lb{position:absolute;bottom:0;inset-inline:0;padding:10px 12px;background:var(--w);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.lcard.blur .ph{filter:blur(9px)}
.lcard .lock{position:absolute;inset:0;display:grid;place-items:center;color:var(--w);z-index:2}
.lcard .lock span{width:46px;height:46px;border-radius:50%;background:var(--p);display:grid;place-items:center}
.slot{aspect-ratio:3/4;border-radius:18px;border:1.5px dashed var(--k40);display:grid;place-items:center;background:var(--w);position:relative;overflow:hidden;color:var(--k60)}
.slot.f{border:0}
.slot .ph{position:absolute;inset:0}
.slot .tagp{position:absolute;bottom:8px;inset-inline-start:8px;z-index:2}
.slot .rm{position:absolute;top:6px;inset-inline-end:6px;z-index:2;width:28px;height:28px;border-radius:50%;background:var(--w);border:0;display:grid;place-items:center}

/* chat */
.chat{height:100%;display:flex;flex-direction:column}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.bub{max-width:78%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.5;position:relative}
.bub.me{align-self:flex-end;background:var(--p);color:var(--w);border-end-end-radius:6px}
.bub.th{align-self:flex-start;background:var(--g);border-end-start-radius:6px}
.bub .mt{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:10.5px;margin-top:2px;opacity:.75;font-family:'Montserrat',sans-serif}
.sysm{align-self:center;font-size:12px;color:var(--k60);background:var(--g);padding:5px 12px;border-radius:12px;margin:8px 0}
.typing{align-self:flex-start;background:var(--g);border-radius:20px;padding:14px 16px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--k40);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25;transform:translateY(-2px)}}
.composer{display:flex;gap:8px;align-items:center;padding:10px 12px calc(var(--sab) + 10px);border-top:1px solid var(--g);background:var(--w)}
.composer input{flex:1;height:46px;border-radius:23px;border:0;background:var(--g);padding:0 18px;font-size:15px;outline:none}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--p);color:var(--w);display:grid;place-items:center}
.unread{min-width:20px;height:20px;border-radius:10px;background:var(--p);color:var(--w);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px;font-family:'Montserrat',sans-serif}
.online{position:absolute;bottom:1px;inset-inline-end:1px;width:12px;height:12px;border-radius:50%;background:var(--p);border:2px solid var(--w)}

/* plans */
.plan{border-radius:22px;border:1.5px solid var(--g);padding:18px;margin-bottom:12px;position:relative;background:var(--w);width:100%;text-align:start;display:block}
.plan.on{border-color:var(--p);box-shadow:0 0 0 1px var(--p)}
.plan.hl{background:var(--k);color:var(--w);border-color:var(--k)}
.plan.hl.on{box-shadow:0 0 0 3px var(--p)}
.plan .pt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plan ul{list-style:none;margin-top:12px;display:grid;gap:8px;font-size:14px}
.plan li{display:flex;gap:8px;align-items:center}
.plan li svg{color:var(--p)}
.plan.hl li svg{color:var(--w)}
.acc{border-bottom:1px solid var(--g)}
.acc button{width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;background:none;border:0;padding:16px 0;font-size:15px;font-weight:600;text-align:start}
.acc p{font-size:14px;line-height:1.7;color:var(--k60);padding-bottom:16px}
.acc svg{transition:.2s}.acc.open svg{transform:rotate(180deg)}
.meter{height:8px;border-radius:4px;background:var(--g);overflow:hidden}
.meter i{display:block;height:100%;background:var(--p);border-radius:4px}
.range2{display:flex;align-items:center;gap:10px}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--g);border-radius:14px;height:52px;padding:0 6px;flex:1}
.step button{width:40px;height:40px;border-radius:11px;border:0;background:var(--w);font-size:20px;font-weight:600}
.step b{font-size:17px;font-family:'Montserrat',sans-serif}
.tl2{display:grid;gap:0}
.tl2 .ti{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:22px}
.tl2 .ti:not(:last-child)::before{content:'';position:absolute;top:28px;bottom:2px;inset-inline-start:13px;width:2px;background:var(--g)}
.tl2 .ti.done:not(:last-child)::before{background:var(--p)}
.tl2 .c{width:28px;height:28px;border-radius:50%;background:var(--g);display:grid;place-items:center;flex:none;color:var(--k60);font-size:12px;font-weight:700}
.tl2 .done .c{background:var(--p);color:var(--w)}
.tl2 .cur .c{background:var(--w);box-shadow:inset 0 0 0 2px var(--p);color:var(--p)}

/* ── admin ── */
.adm{width:var(--W);height:var(--H);background:var(--w);display:flex;overflow:hidden;border-radius:14px;box-shadow:0 0 0 1px var(--g),0 24px 60px rgba(26,26,26,.14)}
.adm aside{width:244px;flex:none;border-inline-end:1px solid var(--g);display:flex;flex-direction:column;padding:18px 12px;overflow:auto;background:var(--w)}
.adm aside .lg{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:700}
.adm aside button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 10px;border-radius:11px;font-size:13.5px;text-align:start;color:var(--k);margin-bottom:2px}
.adm aside button svg{color:var(--k60)}
.adm aside button.on{background:var(--p8);color:var(--p);font-weight:600}
.adm aside button.on svg{color:var(--p)}
.adm aside .cnt{margin-inline-start:auto;font-size:11px;font-weight:700;background:var(--p);color:var(--w);border-radius:9px;padding:1px 7px;font-family:'Montserrat',sans-serif}
.adm main{flex:1;display:flex;flex-direction:column;min-width:0;background:#FFFFFF}
.adm .top{height:64px;flex:none;border-bottom:1px solid var(--g);display:flex;align-items:center;gap:12px;padding:0 24px}
.adm .top .srch{flex:1;max-width:420px;height:40px;border-radius:12px;background:var(--g);border:0;padding:0 14px;font-size:13.5px;outline:none}
.adm .body{flex:1;overflow:auto;padding:24px;background:var(--w)}
.adm .ph1{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.adm .ph1 h2{font-size:22px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{border:1px solid var(--g);border-radius:16px;padding:16px}
.kpi small{font-size:12.5px;color:var(--k60);display:flex;align-items:center;gap:6px}
.kpi b{display:block;font-size:24px;font-weight:700;margin-top:6px;font-family:'Montserrat',sans-serif}
.kpi .d{font-size:12px;color:var(--p);font-weight:600}
.pnl{border:1px solid var(--g);border-radius:18px;padding:18px;margin-bottom:16px;min-width:0}
.pnl h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.bars2{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}
.bars2 div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars2 i{width:100%;max-width:38px;background:var(--p);border-radius:8px 8px 3px 3px}
.bars2 i.k{background:var(--g)}
.bars2 small{font-size:11px;color:var(--k60)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:12px;color:var(--k60);font-weight:600;text-align:start;padding:10px 12px;border-bottom:1px solid var(--g);white-space:nowrap}
table.t td{padding:12px;border-bottom:1px solid var(--g);vertical-align:middle;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
.tw{overflow:auto}
.uc{display:flex;align-items:center;gap:10px}
.ainp{height:36px;border-radius:10px;border:1px solid var(--g);padding:0 10px;font-size:13.5px;width:90px;outline:none;background:var(--w);font-family:'Montserrat',sans-serif}
.ainp:focus{border-color:var(--p)}
.mod{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.mcard{border:1px solid var(--g);border-radius:16px;overflow:hidden}
.mcard .ph{aspect-ratio:3/4}
.mcard .mb{padding:12px;display:grid;gap:8px;font-size:12.5px}
.vq{display:grid;grid-template-columns:300px 1fr;gap:16px}
.qi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:0;background:none;width:100%;text-align:start}
.qi.on{background:var(--p8)}
.perm{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--p);color:var(--w)}
.perm.no{background:var(--g);color:var(--k40)}
.adm.narrow aside{width:72px;padding:18px 8px}
.adm.narrow aside button span,.adm.narrow aside .lg span,.adm.narrow aside .cnt{display:none}
.adm.narrow aside button{justify-content:center}
.adm.narrow .cols,.adm.narrow .vq{grid-template-columns:1fr}
</style>

 <div class="otp ${S.otpErr?'err':''}" id="otp">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" data-otp="${i}" aria-label="digit ${i+1}">`).join('')}</div>
 ${S.otpErr?`<div class="errtx" style="text-align:center;margin-top:12px">${t('otpErr')}</div>`:''}
 <p class="bs mut" style="text-align:center;margin-top:24px">${t('resendIn')} <b class="ltr" style="font-family:Montserrat,sans-serif">00:45</b></p>
 ${dev(`<div class="banner" style="margin-top:26px">${I('info',18)}<span>${t('otpHint')}</span></div>`)}</div>
 <div class="grow"></div><div class="foot"><button class="btn" id="otpBtn" data-act="verifyOtp" disabled>${t('verify')}</button><button class="btn ghost" data-act="back">${t('changeNum')}</button></div></div>`};

SC.age=()=>{const y=+S.dob.y,m=+S.dob.m||1,d=+S.dob.d||1;let age=null;if(y){const n=new Date(2026,10,14),b=new Date(y,m-1,d);age=n.getFullYear()-b.getFullYear()-((n<new Date(n.getFullYear(),m-1,d))?1:0)}
 const under=age!==null&&age<18,ok=S.age1&&S.age2&&age!==null&&!under;
 const sel=(k,ph,opts)=>`<select class="inp ${k==='y'&&under?'err':''}" data-in="dob.${k}" style="text-align:center"><option value="">${ph}</option>${opts.map(o=>`<option ${String(S.dob[k])===String(o)?'selected':''}>${o}</option>`).join('')}</select>`;
 return `<div class="full">${bar('')}<div class="pad"><div class="eic" style="width:64px;height:64px;border-radius:20px;background:var(--p8);color:var(--p);display:grid;place-items:center;margin-bottom:20px">${I('shield',30)}</div><div class="h1">${t('ageT')}</div><p class="bm mut" style="margin:8px 0 26px">${t('ageD')}</p>
 <label class="lbl">${t('dob')}</label><div style="display:grid;grid-template-columns:1fr 1.3fr 1.2fr;gap:10px;font-family:Montserrat,sans-serif">${sel('d',t('day'),Array.from({length:31},(_,i)=>i+1))}${sel('m',t('month'),Array.from({length:12},(_,i)=>i+1))}${sel('y',t('year'),Array.from({length:70},(_,i)=>2026-i))}</div>
 ${under?`<div class="errtx">${t('under18')}</div>`:''}
 <div style="margin-top:22px;display:grid;gap:6px">${chk(S.age1,t('ageConfirm'),'age1')}${chk(S.age2,t('ageSerious'),'age2')}</div></div>
 <div class="grow"></div><div class="foot"><button class="btn" data-go="gender" ${ok?'':'disabled'}>${t('cont')}</button></div></div>`};

SC.gender=()=>`<div class="full">${bar('')}${progress(1)}<div class="pad"><div class="h1">${t('genderT')}</div><p class="bm mut" style="margin:8px 0 26px">${t('genderD')}</p>
 <div class="g2">${[['M','man','male'],['F','woman','female']].map(([k,l,ic])=>`<button class="opt ${S.gender===k?'on':''}" data-act="gender" data-a="${k}" style="flex-direction:column;align-items:center;padding:30px 12px;gap:14px;margin:0"><span style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:${S.gender===k?'var(--p)':'var(--g)'};color:${S.gender===k?'var(--w)':'var(--k)'}">${I(ic,30)}</span><span class="big">${t(l)}</span></button>`).join('')}</div>
 <div class="banner" style="margin-top:22px">${I('info',18)}<span>${t('genderNote')}</span></div></div>
 <div class="grow"></div><div class="foot"><button class="btn" data-go="info">${t('cont')}</button></div></div>`;

SC.info=()=>{const f=S.info;return `<div class="full">${bar('')}${progress(2)}<div class="pad"><div class="h1" style="margin-bottom:24px">${t('infoT')}</div>
 <div class="fld"><label class="lbl">${t('name')}</label><input class="inp" placeholder="${t('namePh')}" value="${f.name}" data-in="info.name"></div>
 <div class="fld g2"><div><label class="lbl">${t('country')}</label><select class="inp">${COUNTRIES.map(c=>`<option>${c[0]} ${S.lang==='ar'?c[2]:c[3]}</option>`).join('')}</select></div><div><label class="lbl">${t('city')}</label><input class="inp" placeholder="${S.lang==='ar'?'دبي':'Dubai'}"></div></div>
 <div class="fld"><label class="lbl">${t('marital')}</label>${chipSel([['m_never',t('m_never')],['m_div',t('m_div')],['m_wid',t('m_wid')]],f.m,'infoM')}</div>
 <div class="fld g2"><div><label class="lbl">${t('education')}</label><select class="inp">${['e_hs','e_dip','e_ba','e_ma','e_phd'].map(e=>`<option ${f.edu===e?'selected':''}>${t(e)}</option>`).join('')}</select></div><div><label class="lbl">${t('job')}</label><input class="inp" placeholder="${t('jobPh')}"></div></div>
 <div class="fld"><label class="lbl">${t('timeline')}</label>${chipSel([['t_6',t('t_6')],['t_1',t('t_1')],['t_2',t('t_2')],['t_ns',t('t_ns')]],f.tl,'infoT')}</div>
 <div class="fld"><label class="lbl">${t('bio')}</label><textarea class="inp" maxlength="500" placeholder="${t('bioPh')}"></textarea><div class="cap ltr" style="text-align:end;margin-top:4px">0/500</div></div>
 <div class="fld"><label class="lbl" style="display:flex;justify-content:space-between">${t('interests')}<span class="cap">${t('upTo8')} · <span class="ltr">${f.ints.length}/8</span></span></label>${chipSel(Object.keys(INTS).map(k=>[k,iname(k)]),f.ints,'infoI',true)}</div></div>
 <div class="foot sticky-foot"><button class="btn" data-go="prefs">${t('cont')}</button></div></div>`};

SC.prefs=()=>{const p=S.pref;const stp=(k)=>`<div class="step"><button data-act="pstep" data-a="${k}:-1">−</button><b>${p[k]}</b><button data-act="pstep" data-a="${k}:1">+</button></div>`;
 return `<div class="full">${bar('')}${progress(3)}<div class="pad"><div class="h1">${t('prefsT')}</div><p class="bm mut" style="margin:8px 0 24px">${t('prefsD')}</p>
 <div class="fld"><label class="lbl">${t('ageRange')}</label><div class="range2">${stp('a1')}<span class="cap">${t('to')}</span>${stp('a2')}</div></div>
 <div class="fld"><label class="lbl">${t('prefCountry')}</label>${chipSel([['same',t('sameCountry')],['any',t('anyCountry')]],p.cty,'pcty')}</div>
 <div class="fld"><label class="lbl">${t('acceptMarital')}</label>${chipSel([['m_never',t('m_never')],['m_div',t('m_div')],['m_wid',t('m_wid')]],p.ms,'pms',true)}</div>
 <div class="fld"><label class="lbl">${t('children')}</label>${chipSel([['yes',t('wantKids')],['np',t('noPref')]],p.kids,'pkids')}</div>
 <div class="banner p">${I('match',18)}<span>${t('mutualNote')}</span></div></div>
 <div class="grow"></div><div class="foot"><button class="btn" data-go="photos">${t('cont')}</button></div></div>`};

SC.photos=()=>{const n=S.photos.filter(Boolean).length,ok=n>=2&&S.rights&&S.policy;
 return `<div class="full">${bar('')}${progress(4)}<div class="pad"><div class="h1">${t('photosT')}</div><p class="bm mut" style="margin:8px 0 22px">${t('photosD')}</p>
 <div class="g3">${S.photos.map((f,i)=>f?`<div class="slot f">${ph()}${i===0?`<span class="tag pf tagp">${t('primary')}</span>`:''}<button class="rm" data-act="photo" data-a="${i}" aria-label="remove">${I('close',14,2.4)}</button></div>`:`<button class="slot" data-act="photo" data-a="${i}"><span style="display:grid;place-items:center;gap:4px">${I('plus',24)}<span class="cap">${t('add')}</span></span></button>`).join('')}</div>
 <div style="margin:18px 0;display:grid;gap:8px">${['ph1','ph2','ph3'].map(k=>`<div style="display:flex;gap:10px;align-items:center;font-size:14px"><span style="color:var(--p)">${I('check',18,2.4)}</span>${t(k)}</div>`).join('')}</div>
 <div class="list" style="margin-bottom:18px">${row('camera',t('selfieT'),t('selfieD'),{p:true,right:`<span class="tag">${t('optional')}</span>`})}</div>
 <div style="display:grid;gap:4px">${chk(S.rights,t('rights'),'rights')}${chk(S.policy,t('policy'),'policy')}</div></div>
 <div class="foot sticky-foot"><button class="btn" data-act="submitReview" ${ok?'':'disabled'}>${t('submitReview')}</button></div></div>`};

SC.verify=()=>{const v=S.verif;const steps=[['tSub',1],['tAuto',1],['tHuman',v==='approved'?1:v==='rejected'?-1:0],['tLive',v==='approved'?1:0]];
 const head={pending:['hour',t('vPending'),t('vPendingD')],rejected:['info',t('vRejected'),t('vRejectedD')],approved:['check',t('vApproved'),t('vApprovedD')]}[v];
 return `<div class="full"><div class="safe-top"></div>${DEVM?`<div class="pad" style="padding-top:14px"><div class="cap" style="margin-bottom:8px">${t('previewStates')}</div><div class="seg" style="width:100%">${['pending','rejected','approved'].map(k=>`<button style="flex:1" class="${v===k?'on':''}" data-act="verif" data-a="${k}">${t(k==='pending'?'st_pending':k==='rejected'?'st_rej':'approved')}</button>`).join('')}</div></div>`:'<div style="height:14px"></div>'}
 <div class="pad fade" style="text-align:center;margin-top:34px"><div style="width:88px;height:88px;border-radius:30px;margin:0 auto 20px;display:grid;place-items:center;background:${v==='approved'?'var(--p)':v==='rejected'?'var(--p8)':'var(--g)'};color:${v==='approved'?'var(--w)':'var(--p)'}">${I(head[0],40,2)}</div><div class="h2">${head[1]}</div><p class="bm mut" style="margin-top:10px">${head[2]}</p></div>
 <div class="pad" style="margin-top:28px">${v==='rejected'?`<div class="list" style="padding:16px"><div class="cap">${t('reason')}</div><div class="bm" style="font-weight:600;margin:4px 0 14px">${t('r1')}</div><div class="cap" style="margin-bottom:8px">${t('fix')}</div>${['fix1','fix2'].map((k,i)=>`<div style="display:flex;gap:10px;font-size:14px;margin-bottom:8px"><span class="tag p ltr">${i+1}</span>${t(k)}</div>`).join('')}</div>`:
 `<div class="tl2">${steps.map(([k,s],i)=>`<div class="ti ${s===1?'done':s===0&&(i===0||steps[i-1][1]===1)?'cur':''}"><span class="c">${s===1?I('check',14,3):i+1}</span><div style="padding-top:3px"><div class="bm" style="font-weight:600">${t(k)}</div></div></div>`).join('')}</div>`}
 ${v==='approved'?`<div class="banner" style="margin-top:4px"><span style="color:var(--p);flex:none">${I('shield',22)}</span><span><b>${t('photosReviewed')}</b><br>${t('notIdentity')}</span></div>`:''}</div>
 <div class="grow"></div><div class="foot">${v==='approved'?`<button class="btn" data-go="discover">${t('startDiscover')}</button>`:v==='rejected'?`<button class="btn" data-go="photos">${t('fixResubmit')}</button>`:`<button class="btn out" data-go="edit">${t('editWhileWait')}</button>`}</div></div>`};

SC.discover=()=>{const list=opp();const left=Math.max(0,quota().l-S.likesUsed);const cur=list[S.deck],nx=list[S.deck+1];
 const card=(p,back)=>`<div class="card ${back?'back':''}" ${back?'':'id="topcard"'} data-pid="${p.id}"><div class="ph">${SIL}<div class="bars">${[0,1,2].map(i=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>${back?'':`<span class="stamp like">${t('like')}</span><span class="stamp pass">${t('pass')}</span>`}<span class="tag pnum" style="background:var(--w)">${I('match',13,2)} <span class="ltr">${p.cmp}%</span> ${t('compatP')}</span></div>
 <div class="info"><div class="nm">${pn(p)}<span class="age">${p.age}</span>${vm(p,22)}</div><div class="cap" style="display:flex;gap:4px;align-items:center;margin:3px 0 8px">${I('pin',14)}${pc(p)} · ${pj(p)}</div><p class="bs" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${pb(p)}</p><div class="chips" style="margin-top:10px">${p.ints.map(k=>`<span class="chip sm">${iname(k)}</span>`).join('')}</div></div></div>`;
 return `<div class="full" style="height:100%;min-height:0"><div class="safe-top"></div>
 <div class="dhead">${LOGO(34)}<div style="flex:1"><div class="h3" style="font-size:18px;font-weight:700">${t('discoverT')}</div><div class="cap"><span class="ltr">${left}</span> ${t('likesLeft')}</div></div><button class="ib soft" data-go="notifs" aria-label="notifications">${I('bell',20)}</button><button class="ib soft" data-go="search" aria-label="filters">${I('filter',20)}</button></div>
 ${cur?`<div class="deck">${nx?card(nx,true):''}${card(cur,false)}</div>
 <div class="acts"><button class="s" data-act="undo" ${S.undo.length?'':'disabled'} aria-label="undo">${Ix('undo',22)}</button><button class="l" data-act="swipe" data-a="pass" aria-label="pass">${I('close',28,2.2)}</button><button class="l lk" data-act="swipe" data-a="like" aria-label="like">${I('heartf',28)}</button><button class="s" data-act="openDetail" data-a="${cur.id}" aria-label="view profile">${I('info',22)}</button></div>`
 :`<div class="empty grow" style="justify-content:center"><div class="eic">${I('discover',38)}</div><div class="h2">${t('noMore')}</div><p class="bm mut">${t('noMoreD')}</p><div style="display:flex;gap:10px;margin-top:10px"><button class="btn sm" data-go="search">${t('adjust')}</button><button class="btn sm out" data-act="resetDeck">${t('reset')}</button></div></div>`}</div>`};

SC.details=()=>{const p=byId(S.detail)||opp()[0];
 return `<div><div class="pd-photo">${ph()}<div class="pd-top"><button class="ib wh" data-act="back">${Ix('back')}</button><button class="ib wh" data-act="sheet" data-a="report">${I('more')}</button></div><div class="bars" style="position:absolute;bottom:14px;inset-inline:16px;display:flex;gap:4px">${[0,1,2].map(i=>`<i style="flex:1;height:3px;border-radius:2px;background:${i?'var(--w60)':'var(--w)'}"></i>`).join('')}</div></div>
 <div class="pad" style="padding-top:18px"><div style="display:flex;align-items:center;gap:8px"><span class="h1">${pn(p)}${AR()?'، ':', '}<span style="font-weight:500">${p.age}</span></span>${vm(p,24)}</div>
 <div class="cap" style="display:flex;gap:4px;align-items:center;margin-top:4px">${I('pin',15)}${pc(p)}</div>
 <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><span class="tag p">${I('match',13,2)} <span class="ltr">${p.cmp}%</span> ${t('compatP')}</span><span class="tag">${t(p.tl)}</span></div>
 <div class="sec">${t('about')}</div><p class="bm">${pb(p)}</p>
 <div class="sec">${t('basics')}</div><div class="kv"><div><small>${t('marital')}</small><b>${t(p.m)}</b></div><div><small>${t('education')}</small><b>${t(p.edu)}</b></div><div><small>${t('job')}</small><b>${pj(p)}</b></div><div><small>${t('timeline')}</small><b>${t(p.tl)}</b></div></div>
 <div class="sec">${t('interests')}</div><div class="chips">${p.ints.map(k=>`<span class="chip">${iname(k)}</span>`).join('')}</div>
 <div class="sec">${t('lifestyle')}</div><div class="kv"><div><small>${t('smoking')}</small><b>${t('no')}</b></div><div><small>${t('relocate')}</small><b>${t('maybe')}</b></div></div>
 <div class="sec">${t('verifs')}</div><div class="list">${row('image',t('photosReviewed'),'',{p:p.v,right:p.v?`<span style="color:var(--p)">${I('check',20,2.4)}</span>`:`<span class="tag">${t('st_pending')}</span>`})}${row('camera',t('live'),'',{p:p.live,right:p.live?`<span style="color:var(--p)">${I('check',20,2.4)}</span>`:'<span class="cap">—</span>'})}${row('shield',t(p.idv?'idVerified':'idNot'),'',{p:p.idv,right:p.idv?`<span style="color:var(--p)">${I('check',20,2.4)}</span>`:'<span class="cap">—</span>'})}</div>
 <button class="btn ghost" style="margin:16px 0 8px" data-act="sheet" data-a="report">${I('flag',18)} ${t('reportBlock')}</button></div>
 <div class="sticky-foot" style="display:flex;gap:12px;padding:12px 20px calc(var(--sab) + 12px)"><button class="btn out" data-act="detailAct" data-a="pass">${I('close',20,2.2)} ${t('pass')}</button><button class="btn" data-act="detailAct" data-a="like">${I('heartf',20)} ${t('like')}</button></div></div>`};

SC.search=()=>{const f=S.filters,paid=S.userPlan!=='free';const stp=k=>`<div class="step"><button data-act="fstep" data-a="${k}:-1">−</button><b>${f[k]}</b><button data-act="fstep" data-a="${k}:1">+</button></div>`;
 const lockRow=(l,opts)=>`<div class="fld"><label class="lbl" style="display:flex;align-items:center;gap:6px">${l} ${paid?'':`<span style="color:var(--k40)">${I('lock',14)}</span>`}</label><div class="chips">${opts.map((o,i)=>`<button class="chip ${paid?'':'lock'} ${paid&&i===0?'on':''}" ${paid?'':'data-go="plans"'}>${o}</button>`).join('')}</div></div>`;
 return `<div class="full">${bar(t('searchT'),{right:`<button class="btn ghost sm" data-act="resetF" style="width:auto">${t('resetF')}</button>`})}<div class="pad">
 <div class="sec" style="margin-top:8px">${t('basicF')}</div>
 <div class="fld"><label class="lbl">${t('ageRange')}</label><div class="range2">${stp('a1')}<span class="cap">${t('to')}</span>${stp('a2')}</div></div>
 <div class="fld"><label class="lbl">${t('country')}</label>${chipSel([['ae',S.lang==='ar'?'الإمارات':'UAE'],['sa',S.lang==='ar'?'السعودية':'Saudi Arabia'],['eg',S.lang==='ar'?'مصر':'Egypt'],['any',t('anyCountry')]],f.cty,'fcty')}</div>
 <div class="fld"><label class="lbl">${t('city')}</label><input class="inp" placeholder="${S.lang==='ar'?'كل المدن':'All cities'}"></div>
 <div class="fld"><label class="lbl">${t('interests')}</label>${chipSel(['read','travel','cook','fit','nature'].map(k=>[k,iname(k)]),f.ints,'fint',true)}</div>
 <div class="sec" style="display:flex;justify-content:space-between;align-items:center">${t('advF')}${paid?`<span class="tag p">${S.userPlan.toUpperCase()}</span>`:`<span class="tag k">${I('lock',12,2)} Plus</span>`}</div>
 ${paid?'':`<div class="banner p" style="margin-bottom:18px;align-items:center">${I('crown',20)}<span style="flex:1">${t('upgradeF')}</span><button class="btn sm" data-go="plans">${t('upgrade')}</button></div>`}
 ${lockRow(t('education'),[t('e_ba'),t('e_ma'),t('e_phd')])}${lockRow(t('marital'),[t('m_never'),t('m_div'),t('m_wid')])}${lockRow(t('occupation'),[S.lang==='ar'?'طب':'Medicine',S.lang==='ar'?'هندسة':'Engineering',S.lang==='ar'?'تعليم':'Education'])}${lockRow(t('compat'),['70%','80%','90%'])}
 </div><div class="foot sticky-foot"><button class="btn" data-go="discover">${t('applyF')}</button></div></div>`};

SC.likes=()=>{const paid=S.userPlan!=='free';const L=opp().filter(p=>p.likesYou).concat(opp().filter(p=>!p.likesYou));
 return `<div>${bar(t('likesT'),{back:false})}<div class="pad"><p class="bm mut" style="margin:-4px 0 16px"><b class="ltr" style="color:var(--k)">12</b> ${t('likesD')}</p>
 ${paid?'':`<div class="list" style="padding:18px;margin-bottom:16px;display:flex;gap:14px;align-items:center"><span style="width:48px;height:48px;border-radius:16px;background:var(--p);color:var(--w);display:grid;place-items:center;flex:none">${I('eye',24)}</span><div style="flex:1"><div class="h3">${t('seeWho')}</div><div class="cap">${t('seeWhoD')}</div></div></div><button class="btn" data-go="plans" style="margin-bottom:18px">${t('upgrade')}</button>`}
 <div class="g2">${L.map(p=>`<button class="lcard ${paid?'':'blur'}" style="border:0;padding:0" ${paid?`data-act="openDetail" data-a="${p.id}"`:'data-go="plans"'}>${ph()}${paid?'':`<span class="lock"><span>${I('lock',22)}</span></span>`}<span class="lb">${paid?`${pn(p)}${AR()?'، ':', '}${p.age} ${vm(p,18)}`:`<span class="sk" style="height:12px;width:70%"></span>`}</span></button>`).join('')}</div></div></div>`};

SC.matches=()=>{const M=opp().slice(0,4);const cl=Math.max(0,quota().m-(S.credits.used||0));
 return `<div>${bar(t('matchesT'),{back:false})}<div class="pad">

/* swipe gesture */
function swipe(){const c=$('#topcard');if(!c)return;let x0=null,dx=0,dy=0,y0;const L=c.querySelector('.stamp.like'),Pz=c.querySelector('.stamp.pass');const rtl=S.lang==='ar';
 c.onpointerdown=e=>{x0=e.clientX;y0=e.clientY;c.setPointerCapture(e.pointerId);c.classList.add('drag')};
 c.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;dy=e.clientY-y0;c.style.transform=`translate(${dx}px,${dy*.2}px) rotate(${dx/18}deg)`;const lk=dx>0;L.style.opacity=lk?Math.min(1,dx/90):0;Pz.style.opacity=!lk?Math.min(1,-dx/90):0};
 c.onpointerup=()=>{if(x0===null)return;c.classList.remove('drag');x0=null;if(Math.abs(dx)>100){doSwipe(dx>0?'like':'pass')}else{c.style.transform='';L.style.opacity=0;Pz.style.opacity=0}dx=0};}

 setTimeout(()=>{S.undo.push(S.deck);S.deck++;if(kind==='like'){S.likesUsed++;if(p.likesYou)S.matchWith=p.id}render()},300)}

function flash(m){const el=document.createElement('div');el.className='toast';el.style.cssText='position:fixed;bottom:30px;z-index:99';el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}

document.addEventListener('click',e=>{
 const ui=e.target.closest('[data-ui]');if(ui&&ui.tagName!=='SELECT'){const k=ui.dataset.ui,a=ui.dataset.a;if(k==='mode')S.mode=a;if(k==='view')S.view=a;if(k==='lang')S.lang=a;if(k==='screen'){S.view='one';S.hist=[];S.sheet=null;S.matchWith=null;S.screen=a}render();if(k==='screen'&&$('#scr'))$('#scr').scrollTop=0;return}
 const ad=e.target.closest('[data-adm]');if(ad){S.adm=ad.dataset.adm;render();return}
 const aa=e.target.closest('[data-adm-act]');if(aa){AACT[aa.dataset.admAct](aa.dataset.a);return}
 const tab=e.target.closest('[data-tab]');if(tab){S.hist=[];go(tab.dataset.tab,false);return}
 const ac=e.target.closest('[data-act]');if(ac&&ac.tagName!=='FORM'){if(ac.disabled)return;const[n,arg]=ac.dataset.act.split(':');const fn=ACT[n];if(fn){e.preventDefault();fn(arg!==undefined?arg:ac.dataset.a)}return}
 const g=e.target.closest('[data-go]');if(g&&!g.disabled){go(g.dataset.go)}
});
document.addEventListener('submit',e=>{e.preventDefault();ACT.sendMsg()});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.ui==='dev'){S.mode==='app'?S.dev=el.value:S.adev=el.value;render()}
 if(el.dataset.ui==='screen'){S.view='one';S.hist=[];S.screen=el.value;render()}
 if(el.dataset.in&&el.dataset.in.startsWith('dob.')){S.dob[el.dataset.in.slice(4)]=el.value;render()}});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.in==='phone'){S.phone=el.value;const b=$('#phoneBtn');if(b)b.disabled=!(S.phone.replace(/\D/g,'').length>=8&&S.terms)}
 if(el.dataset.in==='info.name')S.info.name=el.value;
 if(el.dataset.otp!==undefined){el.value=el.value.replace(/\D/g,'').slice(-1);const ins=[...document.querySelectorAll('[data-otp]')];const i=+el.dataset.otp;if(el.value&&i<5)ins[i+1].focus();$('#otpBtn').disabled=ins.some(x=>!x.value)}});
document.addEventListener('keydown',e=>{const el=e.target;if(el.dataset&&el.dataset.otp!==undefined&&e.key==='Backspace'&&!el.value){const ins=[...document.querySelectorAll('[data-otp]')];const i=+el.dataset.otp;if(i>0)ins[i-1].focus()}});
document.addEventListener('paste',e=>{const el=e.target;if(el.dataset&&el.dataset.otp!==undefined){const v=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(v.length){e.preventDefault();const ins=[...document.querySelectorAll('[data-otp]')];v.split('').forEach((c,i)=>ins[i]&&(ins[i].value=c));$('#otpBtn').disabled=v.length<6}}});
window.addEventListener('resize',()=>{clearTimeout(render._r);render._r=setTimeout(render,120)});

 notes.forEach(([f,t0])=>{const o=AC.createOscillator(),g=AC.createGain(),o2=AC.createOscillator(),g2=AC.createGain();o.frequency.value=f;o2.frequency.value=f*2.01;const st=AC.currentTime+t0;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.22,st+.006);g.gain.exponentialRampToValueAtTime(.0008,st+.6);g2.gain.setValueAtTime(.07,st);g2.gain.exponentialRampToValueAtTime(.0005,st+.25);o.connect(g).connect(AC.destination);o2.connect(g2).connect(AC.destination);o.start(st);o2.start(st);o.stop(st+.65);o2.stop(st+.3)})}catch(e){}};

diat, suppression définitive après 30 jours.","What we collect":"Ce que nous collectons","Phone number, profile details (including height and weight if you add them), reviewed photos, approximate location (≈1 km) with your permission, activity and the messages, photos and voice notes you send, and payment status — never card numbers.":"Numéro de téléphone, informations du profil (y compris la taille et le poids si vous les ajoutez), photos vérifiées, position approximative (≈1 km) avec votre autorisation, activité ainsi que les messages, photos et messages vocaux que vous envoyez, et statut des paiements — jamais de numéros de carte.","Why":"Pourquoi","To run matching, chat and consultations, enforce plan limits, keep the community safe and prevent fraud. We never sell your data or use it for third-party ads.":"Pour faire fonctionner la mise en relation, la messagerie et les consultations, appliquer les limites des offres, protéger la communauté et prévenir la fraude. Nous ne vendons jamais vos données et ne les utilisons pas pour de la publicité tierce.","What others see":"Ce que voient les autres","Only your public profile — never your phone number or exact location. You control visibility, incognito, blurred photos, online status and read receipts.":"Uniquement votre profil public — jamais votre numéro de téléphone ni votre position exacte. Vous contrôlez la visibilité, le mode incognito, le floutage des photos, le statut en ligne et les accusés de lecture.","Retention and deletion":"Conservation et suppression","Inactive chats 15 days, archive 30 days, unmatched 30 days. Deleted accounts are erased after 30 days except what the law requires.":"Conversations inactives 15 jours, archives 30 jours, affinités annulées 30 jours. Les comptes supprimés sont effacés après 30 jours, sauf ce que la loi impose de conserver.","Your rights":"Vos droits","Download your data, correct it, delete in the app, freeze instead of deleting, withdraw location or notification permission.":"Télécharger vos données, les rectifier, supprimer votre compte dans l’application, geler plutôt que supprimer, retirer l’autorisation de localisation ou de notifications.","The fee":"La commission","OLFA keeps 15% of each paid consultation to develop and run the platform, for marketing, advertising campaigns and promoting professionals’ profiles. Your net amount is shown before each booking and in your wallet.":"OLFA conserve 15 % de chaque consultation payée pour développer et faire fonctionner la plateforme, pour le marketing, les campagnes publicitaires et la promotion des profils des professionnels. Votre montant net s’affiche avant chaque réservation et dans votre portefeuille.","Clients you meet on OLFA":"Les clients rencontrés sur OLFA","Sessions, follow-ups and payments with these clients happen inside OLFA. Don’t ask for or share contact details to move sessions or payment off the platform.":"Les séances, suivis et paiements avec ces clients ont lieu dans OLFA. Ne demandez ni ne partagez de coordonnées pour déplacer des séances ou des paiements hors de la plateforme.","How we detect circumvention":"Comment nous détectons le contournement","After every consultation the client answers a mandatory questionnaire about quality, commitment, results, any next appointment and any request to contact or pay outside OLFA. Repeated answers from different clients are analysed; a single report never opens a review.":"Après chaque consultation, le client répond à un questionnaire obligatoire sur la qualité, le sérieux, les résultats, un éventuel prochain rendez-vous et toute demande de contact ou de paiement hors d’OLFA. Les réponses répétées de clients différents sont analysées ; un signalement isolé n’ouvre jamais d’examen.","A fair review":"Un examen équitable","We tell you about the review and summarise the reasons without revealing clients, and give you 7 days to respond. A human reviewer decides: clear, warn, suspend or permanently ban. Withdrawals pause only during the review; your earnings are kept.":"Nous vous informons de l’examen et en résumons les raisons sans révéler l’identité des clients, et vous laissons 7 jours pour répondre. Une personne décide : blanchir, avertir, suspendre ou bannir définitivement. Les retraits ne sont suspendus que pendant l’examen ; vos gains sont conservés.","Permanent ban":"Bannissement définitif","On a permanent ban, hashed fingerprints of the phone number, device, licence and payout account are kept to prevent re-registration, in line with applicable law. You can appeal once within 30 days.":"En cas de bannissement définitif, des empreintes hachées du numéro de téléphone, de l’appareil, de la licence et du compte de versement sont conservées pour empêcher toute réinscription, conformément à la loi applicable. Vous pouvez faire appel une fois dans les 30 jours.","Welcome — our session is tomorrow at 7 pm":"Bienvenue — notre séance est demain à 19 h","Lovely, happy to know you more 😊":"Avec plaisir, ravie d’en savoir plus sur toi 😊","Lovely, happy to get to know you more 😊":"Avec plaisir, ravie d’en savoir plus sur toi 😊","Thanks for the lovely chat":"Merci pour cette belle conversation","Nice to meet you":"Ravie de te connaître","What do you think about work after marriage?":"Que penses-tu du travail après le mariage ?","Do you prefer travel or settling?":"Tu préfères voyager ou te poser ?","Hello! Glad we matched 🌿":"Bonjour ! Contente de cette affinité 🌿","Hi! Likewise. I read that you love design?":"Bonjour ! Moi aussi. J’ai lu que tu aimes le design ?","Nice — here is my number 050 123 4567":"Super — voici mon numéro 050 123 4567","Shall we meet at the public library on Friday?":"On se retrouve à la bibliothèque municipale vendredi ?","I love travelling to old cities":"J’adore voyager dans les villes anciennes","«Lovely smile — I liked what you wrote about volunteering»":"« Joli sourire — j’ai aimé ce que tu as écrit sur le bénévolat »","Lovely smile — I liked what you wrote about v
