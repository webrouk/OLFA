# Local development stack: PostgreSQL, Redis, MinIO (S3), API and worker.
#   cp .env.example .env && docker compose up -d --build
#   docker compose exec api npx prisma migrate deploy
#   docker compose exec api sh -c 'psql "$DATABASE_URL" -f prisma/seed.sql'
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: olfa, POSTGRES_PASSWORD: olfa, POSTGRES_DB: olfa }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U olfa"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: olfa-local, MINIO_ROOT_PASSWORD: olfa-local-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 olfa-local olfa-local-secret &&
      mc mb -p local/olfa-private local/olfa-public &&
      mc anonymous set download local/olfa-public && echo buckets ready"

  api:
    build: ./backend
    env_file: .env
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    ports: ["3000:3000"]

  worker:
    build: ./backend
    command: ["node", "dist/worker.js"]
    env_file: .env
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

volumes:
  pgdata:
  miniodata:
